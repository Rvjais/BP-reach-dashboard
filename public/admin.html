<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BP-reach Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --border: #e3e6eb; --border-strong: #cfd4dc;
  --text: #111827; --text-2: #4b5563; --text-3: #8a93a2;
  --accent: #2563eb; --accent-hover: #1d4ed8; --accent-soft: #eaf1ff; --on-accent: #ffffff;
  --good: #0a7d33; --good-soft: #e6f5ea; --warn: #9a6200; --warn-soft: #fdf3dc; --bad: #c0322f; --bad-soft: #fdeceb; --mute-soft: #eef0f3;
  --shadow-lg: 0 12px 40px rgba(16,24,40,.18);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1116; --surface: #161a21; --surface-2: #1d222b; --border: #272d38; --border-strong: #38404e;
  --text: #f3f4f6; --text-2: #b4bcc9; --text-3: #7d8797;
  --accent: #5b94f5; --accent-hover: #7aa9f8; --accent-soft: #17253f; --on-accent: #0b1220;
  --good: #4ac776; --good-soft: #12291b; --warn: #e8b04a; --warn-soft: #2e2410; --bad: #f07773; --bad-soft: #321716; --mute-soft: #222834;
  --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
button, input { font: inherit; color: inherit; }
h1, h2 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
.hidden { display: none !important; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand-mark svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.login-wrap { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.login-card, .modal-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; box-shadow: var(--shadow-lg); }
.field { margin-top: 16px; } .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
.input { width: 100%; height: 40px; padding: 0 12px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 7px; outline: none; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.hint { font-size: 12px; color: var(--text-3); margin-top: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 13px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface); font-weight: 500; font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); } .btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; } .btn.primary:hover { background: var(--accent-hover); }
.btn.danger { color: var(--bad); } .btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; } .btn.block { width: 100%; height: 42px; margin-top: 22px; }
.alert { padding: 11px 14px; border-radius: 7px; font-size: 13px; margin-bottom: 16px; } .alert.bad { background: var(--bad-soft); color: var(--bad); } .alert.warn { background: var(--warn-soft); color: var(--warn); } .alert.good { background: var(--good-soft); color: var(--good); }
.top { display: flex; align-items: center; gap: 14px; padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
.top .right { margin-left: auto; display: flex; gap: 8px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 28px; }
.head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; } .head h1 { font-size: 21px; } .head p { margin: 4px 0 0; color: var(--text-2); }
.head .input { margin-left: auto; max-width: 280px; height: 36px; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; } .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; min-width: 150px; } .stat b { display: block; font-size: 22px; font-weight: 600; } .stat span { font-size: 12.5px; color: var(--text-2); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; } th { text-align: left; font-size: 12px; font-weight: 600; color: var(--text-3); padding: 10px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; } tbody tr:last-child td { border-bottom: 0; }
.person { display: flex; align-items: center; gap: 11px; } .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 12px; flex: none; }
.main { font-weight: 600; } .sub { font-size: 12px; color: var(--text-3); }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--mute-soft); color: var(--text-2); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; } .badge.good { background: var(--good-soft); color: var(--good); } .badge.bad { background: var(--bad-soft); color: var(--bad); } .badge.warn { background: var(--warn-soft); color: var(--warn); }
.actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.modal { position: fixed; inset: 0; background: rgba(10,14,22,.5); display: grid; place-items: center; padding: 16px; z-index: 10; } .modal-card { max-width: 440px; } .modal-card h2 { font-size: 17px; }
.pw-row { display: flex; gap: 8px; } .pw-row .input { font-family: ui-monospace, Consolas, monospace; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
.state { padding: 44px 20px; text-align: center; color: var(--text-3); }
@media (max-width: 700px) { .wrap { padding: 18px 14px; } .top { padding: 12px 14px; } }
</style>
</head>
<body>

<div id="login" class="login-wrap hidden">
  <form class="login-card" id="login-form">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6z"/></svg></span>BP-reach Admin</div>
    <h1 style="font-size:20px;margin-top:22px">Administrator sign in</h1>
    <div class="field"><label for="a-email">Admin login</label><input class="input" id="a-email" type="text" autocomplete="username" value="admin" required></div>
    <div class="field"><label for="a-pass">Password</label><input class="input" id="a-pass" type="password" autocomplete="current-password" required></div>
    <div id="login-error" class="alert bad hidden" style="margin:14px 0 0"></div>
    <button class="btn primary block" id="login-btn" type="submit">Sign in</button>
    <div class="hint" style="text-align:center;margin-top:14px"><a href="/">← Back to dashboard</a></div>
  </form>
</div>

<div id="panel" class="hidden">
  <header class="top">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6z"/></svg></span>BP-reach Admin</div>
    <div class="right"><a class="btn" href="/">Open dashboard</a><button class="btn" onclick="logout()">Sign out</button></div>
  </header>
  <div class="wrap">
    <div class="head">
      <div><h1>User access</h1><p>Each login can see exactly one LinkedIn account — its campaigns, lists, inbox and stats.</p></div>
      <input class="input" id="search" type="search" placeholder="Search accounts…">
    </div>
    <div id="notice"></div>
    <div class="stats" id="stats"></div>
    <div class="card" id="table"><div class="state">Loading accounts…</div></div>
  </div>
</div>

<div id="modal-root"></div>

<script>
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const initials = name => (name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
let DATA = { items: [] }, FILTER = '';

async function api(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' } : { credentials: 'same-origin' });
  let data; try { data = await res.json(); } catch { data = { error: `Unexpected response (HTTP ${res.status})` }; }
  if ((res.status === 401 || res.status === 403) && !path.startsWith('/api/auth/')) { showLogin(res.status === 403 ? 'This area is for the administrator only.' : ''); throw new Error('Not signed in'); }
  if (data && data.error) throw new Error(data.error);
  return data;
}
function showLogin(msg) { $('panel').classList.add('hidden'); $('login').classList.remove('hidden'); $('login-error').textContent = msg || ''; $('login-error').classList.toggle('hidden', !msg); }
$('login-form').addEventListener('submit', async e => {
  e.preventDefault(); const btn = $('login-btn'); btn.disabled = true; $('login-error').classList.add('hidden');
  try { const me = await api('/api/auth/login', { email: $('a-email').value, password: $('a-pass').value }); $('a-pass').value = ''; if (me.role !== 'admin') { await api('/api/auth/logout', {}); throw new Error('This area is for the administrator only.'); } await boot(); }
  catch (err) { $('login-error').textContent = err.message; $('login-error').classList.remove('hidden'); }
  btn.disabled = false;
});
async function logout() { try { await api('/api/auth/logout', {}); } catch {} showLogin(); }

async function boot() {
  let me; try { me = await api('/api/auth/me'); } catch { return showLogin(); }
  if (me.role !== 'admin') return showLogin('This area is for the administrator only.');
  $('login').classList.add('hidden'); $('panel').classList.remove('hidden');
  await load();
}
async function load() {
  try { DATA = await api('/api/admin/users'); draw(); }
  catch (e) { $('table').innerHTML = `<div class="state" style="color:var(--bad)">${esc(e.message)}</div>`; }
}
function access(r) {
  if (!r.hasPassword) return '<span class="badge">No login</span>';
  return r.enabled ? '<span class="badge good">Can sign in</span>' : '<span class="badge warn">Disabled</span>';
}
function draw() {
  const items = DATA.items || [], withLogin = items.filter(r => r.hasPassword && r.enabled).length;
  $('notice').innerHTML = (DATA.storageError ? `<div class="alert bad"><strong>Logins can't be saved yet.</strong> ${esc(DATA.storageError)}</div>` : DATA.storage === 'file' ? `<div class="alert warn">Logins are being saved to a local file (<code>.data/users.json</code>). That's fine for local testing; on Vercel add the Upstash Redis integration.</div>` : '')
    + ((DATA.orphans || []).length ? `<div class="alert warn">${DATA.orphans.length} login(s) belong to LinkedIn accounts that no longer exist in HeyReach: ${DATA.orphans.map(o => `${esc(o.loginEmail)} <button class="btn sm danger" onclick="removeLogin(${Number(o.accountId)}, true)">Remove</button>`).join(' ')}</div>` : '');
  $('stats').innerHTML = `<div class="stat"><b>${items.length}</b><span>LinkedIn accounts</span></div><div class="stat"><b>${items.filter(r => r.isActive).length}</b><span>Active in HeyReach</span></div><div class="stat"><b>${withLogin}</b><span>With dashboard access</span></div>`;
  const rows = items.filter(r => !FILTER || `${r.name} ${r.linkedinEmail || ''} ${r.loginEmail || ''}`.toLowerCase().includes(FILTER));
  $('table').innerHTML = rows.length ? `<table><thead><tr><th>LinkedIn account</th><th>HeyReach status</th><th>Login email</th><th>Dashboard access</th><th></th></tr></thead><tbody>${rows.map(r => {
    const i = items.indexOf(r);
    return `<tr><td><div class="person"><div class="avatar">${esc(initials(r.name))}</div><div><div class="main">${esc(r.name)}</div><div class="sub">${esc(r.linkedinEmail || 'ID ' + r.accountId)}</div></div></div></td>
      <td>${r.isActive ? '<span class="badge good">Active</span>' : '<span class="badge bad">Inactive</span>'}<div class="sub" style="margin-top:3px">${Number(r.activeCampaigns) || 0} active campaign${r.activeCampaigns === 1 ? '' : 's'}</div></td>
      <td>${r.loginEmail ? esc(r.loginEmail) : '<span class="sub">—</span>'}${r.updatedAt ? `<div class="sub">Updated ${esc(new Date(r.updatedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }))}</div>` : ''}</td>
      <td>${access(r)}</td>
      <td><div class="actions"><button class="btn sm primary" onclick="openEdit(${i})">${r.hasPassword ? 'Change password' : 'Create login'}</button>${r.hasPassword ? `<button class="btn sm" onclick="toggle(${i})">${r.enabled ? 'Disable' : 'Enable'}</button><button class="btn sm danger" onclick="removeLogin(${Number(r.accountId)})">Remove</button>` : ''}</div></td></tr>`;
  }).join('')}</tbody></table>` : `<div class="state">${items.length ? 'No accounts match your search.' : 'No LinkedIn accounts found in HeyReach.'}</div>`;
}
$('search').addEventListener('input', e => { FILTER = e.target.value.toLowerCase(); draw(); });

function generatePassword() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789', buf = new Uint32Array(16);
  crypto.getRandomValues(buf);
  return Array.from(buf, v => chars[v % chars.length]).join('');
}
function openEdit(i) {
  const r = DATA.items[i];
  $('modal-root').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()"><form class="modal-card" id="edit-form">
    <h2>${r.hasPassword ? 'Change login' : 'Create login'} · ${esc(r.name)}</h2>
    <div class="hint" style="margin-top:4px">This person will only see data for this LinkedIn account.</div>
    <div class="field"><label for="e-email">Login email</label><input class="input" id="e-email" type="email" required value="${esc(r.loginEmail || r.linkedinEmail || '')}"></div>
    <div class="field"><label for="e-pass">${r.hasPassword ? 'New password' : 'Password'}</label>
      <div class="pw-row"><input class="input" id="e-pass" type="text" autocomplete="off" minlength="8" required placeholder="At least 8 characters"><button class="btn" type="button" onclick="document.getElementById('e-pass').value=generatePassword()">Generate</button></div>
      <div class="hint">Copy it now and send it to the user — it is stored as a one-way hash and can't be shown again.${r.hasPassword ? ' Saving signs them out everywhere.' : ''}</div></div>
    <div id="edit-error" class="alert bad hidden" style="margin:14px 0 0"></div>
    <div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn" type="button" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('e-pass').value)">Copy password</button><button class="btn primary" id="edit-save" type="submit">Save</button></div>
  </form></div>`;
  $('edit-form').addEventListener('submit', async e => {
    e.preventDefault(); $('edit-save').disabled = true;
    try { await api('/api/admin/users/set', { accountId: r.accountId, email: $('e-email').value, password: $('e-pass').value, enabled: true }); closeModal(); await load(); }
    catch (err) { $('edit-error').textContent = err.message; $('edit-error').classList.remove('hidden'); $('edit-save').disabled = false; }
  });
  $('e-pass').focus();
}
function closeModal() { $('modal-root').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
async function toggle(i) {
  const r = DATA.items[i];
  try { await api('/api/admin/users/set', { accountId: r.accountId, email: r.loginEmail, enabled: !r.enabled }); await load(); } catch (e) { alert(e.message); }
}
async function removeLogin(accountId, skipConfirm) {
  if (!skipConfirm && !confirm('Remove this login? The person will no longer be able to sign in.')) return;
  try { await api('/api/admin/users/remove', { accountId }); await load(); } catch (e) { alert(e.message); }
}

try { const t = localStorage.getItem('bp-theme'); document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch { document.documentElement.dataset.theme = 'light'; }
boot();
</script>
</body>
</html>
