<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BP-reach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --border: #e3e6eb; --border-strong: #cfd4dc;
  --text: #111827; --text-2: #4b5563; --text-3: #8a93a2;
  --accent: #2563eb; --accent-hover: #1d4ed8; --accent-soft: #eaf1ff; --on-accent: #ffffff;
  --good: #0a7d33; --good-soft: #e6f5ea; --warn: #9a6200; --warn-soft: #fdf3dc;
  --bad: #c0322f; --bad-soft: #fdeceb; --info: #5b3fc4; --info-soft: #efebfc; --mute-soft: #eef0f3;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --grid: #e6e8ec; --axis: #c5cad3;
  --shadow: 0 1px 2px rgba(16,24,40,.05); --shadow-lg: 0 12px 40px rgba(16,24,40,.18);
  --radius: 10px; --radius-sm: 7px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1116; --surface: #161a21; --surface-2: #1d222b; --border: #272d38; --border-strong: #38404e;
  --text: #f3f4f6; --text-2: #b4bcc9; --text-3: #7d8797;
  --accent: #5b94f5; --accent-hover: #7aa9f8; --accent-soft: #17253f; --on-accent: #0b1220;
  --good: #4ac776; --good-soft: #12291b; --warn: #e8b04a; --warn-soft: #2e2410;
  --bad: #f07773; --bad-soft: #321716; --info: #a896f0; --info-soft: #211b3a; --mute-soft: #222834;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --grid: #232934; --axis: #38404e;
  --shadow: none; --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
.hidden { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-3); } .sub { color: var(--text-2); }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Login */
.login-wrap { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.login-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px 28px; box-shadow: var(--shadow-lg); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -.02em; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.login-card h1 { font-size: 20px; margin: 22px 0 4px; }
.field { margin-top: 16px; } .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
.input { width: 100%; height: 40px; padding: 0 12px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); outline: none; }
.input:focus, .select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.form-error { margin-top: 14px; padding: 9px 12px; border-radius: var(--radius-sm); background: var(--bad-soft); color: var(--bad); font-size: 13px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 13px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); font-weight: 500; font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); } .btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.block { width: 100%; height: 42px; margin-top: 22px; font-size: 14px; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; } .btn.icon { width: 36px; padding: 0; }
.select { height: 36px; padding: 0 30px 0 11px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); outline: none; max-width: 220px; font-size: 13px; }

/* Shell */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100%; }
.side { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; padding: 18px 12px; }
.side .brand { padding: 2px 8px 18px; }
.nav-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); padding: 14px 10px 6px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); color: var(--text-2); font-weight: 500; text-decoration: none; }
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side-foot { margin-top: auto; border-top: 1px solid var(--border); padding-top: 12px; }
.me { display: flex; align-items: center; gap: 10px; padding: 6px 8px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 12px; flex: none; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.me-name { font-weight: 600; font-size: 13px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-sub { font-size: 11.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.top h1 { font-size: 19px; } .top .sub { font-size: 13px; }
.top-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.content { padding: 24px 28px 48px; max-width: 1360px; width: 100%; }
.menu-btn { display: none; }
.scrim { display: none; }

/* Cards, tiles */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 16px 18px 0; } .card-h h3 { font-size: 14px; } .card-h .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.card-b { padding: 16px 18px 18px; }
.section-title { display: flex; align-items: baseline; gap: 10px; margin: 28px 0 12px; } .section-title h2 { font-size: 15px; } .section-title span { font-size: 12.5px; color: var(--text-3); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.tile { padding: 16px 18px; } .tile-label { font-size: 12.5px; color: var(--text-2); font-weight: 500; }
.tile-value { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin-top: 6px; line-height: 1.15; }
.tile-note { font-size: 12.5px; color: var(--text-3); margin-top: 4px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; }
.grid-half { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--mute-soft); color: var(--text-2); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.good { background: var(--good-soft); color: var(--good); } .badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); } .badge.info { background: var(--info-soft); color: var(--info); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.chip { display: inline-block; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; color: var(--text-2); }

/* Tables */
.tbl-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.tbl-bar .search { flex: 1 1 220px; max-width: 340px; height: 34px; } .tbl-count { margin-left: auto; font-size: 12.5px; color: var(--text-3); }
.tbl-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--text-3); padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; user-select: none; background: var(--surface); }
th.sortable { cursor: pointer; } th.sortable:hover { color: var(--text); } th.r, td.r { text-align: right; }
td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; } tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
tfoot td { font-weight: 600; background: var(--surface-2); border-top: 1px solid var(--border-strong); }
.tbl-foot { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--text-3); }
.tbl-foot .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.cell-main { font-weight: 600; } .cell-sub { font-size: 12px; color: var(--text-3); }
.progress { display: flex; align-items: center; gap: 8px; min-width: 130px; }
.progress-track { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; } .progress-fill { height: 100%; border-radius: 3px; background: var(--accent); }

/* States */
.state { padding: 44px 20px; text-align: center; color: var(--text-3); } .state strong { display: block; color: var(--text); font-size: 14px; margin-bottom: 4px; }
.alert { padding: 11px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 14px; border: 1px solid transparent; }
.alert.bad { background: var(--bad-soft); color: var(--bad); } .alert.warn { background: var(--warn-soft); color: var(--warn); }
.skel { border-radius: var(--radius); background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 37%, var(--surface-2) 63%); background-size: 400% 100%; animation: sk 1.3s ease infinite; }
@keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

/* Charts */
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart { position: relative; height: 270px; } .chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart text { font-size: 11px; fill: var(--text-3); font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; box-shadow: var(--shadow-lg); padding: 9px 11px; font-size: 12.5px; min-width: 170px; z-index: 5; }
.tip-h { font-weight: 600; margin-bottom: 5px; } .tip-r { display: flex; align-items: center; gap: 7px; color: var(--text-2); } .tip-r b { margin-left: auto; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; } .tip-r i { width: 8px; height: 8px; border-radius: 2px; }
.hbar { display: grid; grid-template-columns: minmax(90px, 140px) 1fr auto; gap: 10px; align-items: center; padding: 7px 0; font-size: 13px; }
.hbar-track { height: 10px; background: var(--surface-2); border-radius: 0 4px 4px 0; } .hbar-fill { height: 100%; min-width: 2px; border-radius: 0 4px 4px 0; background: var(--s1); }
.hbar b { font-weight: 600; font-variant-numeric: tabular-nums; } .hbar small { color: var(--text-3); margin-left: 6px; }

/* Drawer */
.drawer-scrim { position: fixed; inset: 0; background: rgba(10,14,22,.45); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(920px, 100%); background: var(--bg); border-left: 1px solid var(--border); z-index: 41; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
.drawer-h { padding: 18px 22px 0; background: var(--surface); border-bottom: 1px solid var(--border); }
.drawer-title { display: flex; gap: 12px; align-items: flex-start; } .drawer-title h2 { font-size: 17px; } .drawer-title .btn { margin-left: auto; }
.tabs { display: flex; gap: 2px; margin-top: 14px; } .tab { padding: 9px 13px; border: 0; background: none; cursor: pointer; font-weight: 500; color: var(--text-2); border-bottom: 2px solid transparent; font-size: 13px; }
.tab:hover { color: var(--text); } .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.drawer-b { flex: 1; overflow-y: auto; padding: 20px 22px 40px; }
.kv { display: grid; grid-template-columns: minmax(130px, 210px) 1fr; } .kv > div { padding: 9px 14px; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; } .kv > div:nth-child(odd) { color: var(--text-2); font-size: 13px; } .kv > div:nth-last-child(-n+2) { border-bottom: 0; }
pre.json { margin: 0; font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; color: var(--text-2); }

/* Sequence flow */
.flow { display: flex; flex-direction: column; align-items: center; min-width: min-content; } .flow-scroll { overflow-x: auto; padding-bottom: 8px; }
.node { width: 270px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
.node-h { display: flex; align-items: center; gap: 10px; } .node-ic { width: 32px; height: 32px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.node-t { font-weight: 600; font-size: 13px; } .node-d { font-size: 11.5px; color: var(--text-3); }
.node-msg { margin-top: 10px; padding: 8px 10px; background: var(--surface-2); border-radius: 6px; font-size: 12px; color: var(--text-2); white-space: pre-wrap; max-height: 120px; overflow: auto; }
.node.end { width: 150px; text-align: center; border-style: dashed; color: var(--text-3); font-weight: 600; font-size: 12.5px; }
.wire { width: 2px; height: 22px; background: var(--border-strong); }
.branches { display: flex; gap: 18px; align-items: flex-start; border-top: 2px solid var(--border-strong); padding-top: 0; }
.branch { display: flex; flex-direction: column; align-items: center; } .branch-label { margin: 0 0 0; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.branch-label.yes { background: var(--good-soft); color: var(--good); } .branch-label.no { background: var(--mute-soft); color: var(--text-2); }

/* Inbox */
.inbox { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - 150px); min-height: 480px; overflow: hidden; }
.conv-list { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; } .conv-scroll { overflow-y: auto; flex: 1; }
.conv { display: flex; gap: 11px; padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; } .conv:hover { background: var(--surface-2); } .conv.active { background: var(--accent-soft); }
.conv-body { min-width: 0; flex: 1; } .conv-top { display: flex; gap: 8px; align-items: baseline; } .conv-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .conv.unread .conv-name::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 7px; }
.conv-time { margin-left: auto; font-size: 11.5px; color: var(--text-3); white-space: nowrap; } .conv-prev { font-size: 12.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; } .chat-h { padding: 13px 18px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; }
.chat-b { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
.msg { max-width: 72%; padding: 9px 13px; border-radius: 14px; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface); border: 1px solid var(--border); align-self: flex-start; }
.msg.out { align-self: flex-end; background: var(--accent); border-color: var(--accent); color: var(--on-accent); } .msg-t { display: block; font-size: 11px; opacity: .7; margin-top: 4px; }
.back-btn { display: none; }

.acct-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.acct { padding: 18px; } .acct-top { display: flex; gap: 12px; align-items: center; } .acct-top .avatar { width: 44px; height: 44px; font-size: 15px; }
.acct-stats { display: flex; gap: 22px; margin: 16px 0; } .acct-stats b { display: block; font-size: 18px; font-weight: 600; } .acct-stats span { font-size: 12px; color: var(--text-3); }

@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 50; left: 0; width: 250px; transform: translateX(-100%); transition: transform .2s; }
  .app.nav-open .side { transform: none; } .app.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(10,14,22,.45); z-index: 49; }
  .menu-btn { display: inline-flex; } .top { padding: 12px 16px; } .content { padding: 18px 16px 40px; }
  .grid-2, .grid-half { grid-template-columns: 1fr; }
  .inbox { grid-template-columns: 1fr; } .inbox .chat { display: none; } .inbox.open .chat { display: flex; } .inbox.open .conv-list { display: none; } .back-btn { display: inline-flex; }
  .kv { grid-template-columns: 1fr; } .kv > div:nth-child(odd) { border-bottom: 0; padding-bottom: 0; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login-wrap hidden">
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="brand"><span class="brand-mark"><svg class="i" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span>BP-reach</div>
    <h1>Sign in</h1>
    <div class="sub">View your LinkedIn outreach performance.</div>
    <div class="field"><label for="login-email">Email</label><input class="input" id="login-email" type="text" autocomplete="username" required></div>
    <div class="field"><label for="login-password">Password</label><input class="input" id="login-password" type="password" autocomplete="current-password" required></div>
    <div id="login-error" class="form-error hidden"></div>
    <button class="btn primary block" id="login-btn" type="submit">Sign in</button>
  </form>
</div>

<!-- APP -->
<div id="app" class="app hidden">
  <div class="scrim" onclick="toggleNav(false)"></div>
  <aside class="side">
    <div class="brand"><span class="brand-mark"><svg class="i" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span>BP-reach</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="me"><div class="avatar" id="me-avatar"></div><div style="min-width:0"><div class="me-name" id="me-name"></div><div class="me-sub" id="me-sub"></div></div></div>
      <nav class="nav">
        <a href="/admin" id="admin-link" class="hidden"><svg class="i" viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6z"/></svg>Admin panel</a>
        <a href="#" onclick="logout();return false"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign out</a>
      </nav>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="btn icon menu-btn" onclick="toggleNav(true)" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div><h1 id="page-title"></h1><div class="sub" id="page-sub"></div></div>
      <div class="top-tools">
        <select class="select hidden" id="account-filter" aria-label="LinkedIn account"></select>
        <select class="select hidden" id="range-filter" aria-label="Date range">
          <option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option><option value="365">Last 12 months</option>
        </select>
        <button class="btn icon" onclick="refresh()" title="Refresh data" aria-label="Refresh"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-2.6-6.4M21 3v6h-6"/></svg></button>
        <button class="btn icon" onclick="toggleTheme()" title="Light / dark" aria-label="Toggle theme"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div id="drawer-root"></div>

<script>
/* ═════════ Helpers ═════════ */
const $ = id => document.getElementById(id);

const safeUrl = u => (/^https?:\/\//i.test(u || '') ? u : '');

const STATUS = { IN_PROGRESS: ['good', 'Active'], FINISHED: ['accent', 'Finished'], PAUSED: ['warn', 'Paused'], DRAFT: ['', 'Draft'], SCHEDULED: ['info', 'Scheduled'], STARTING: ['info', 'Starting'], FAILED: ['bad', 'Failed'], CANCELED: ['bad', 'Canceled'] };
const badge = s => { const [cls, label] = STATUS[s] || ['', humanize(s) || 'Unknown']; return `<span class="badge ${cls}">${esc(label)}</span>`; };
const progress = (done, total) => { const p = total > 0 ? Math.round(done / total * 100) : 0; return `<div class="progress"><div class="progress-track"><div class="progress-fill" style="width:${p}%"></div></div><span class="num cell-sub">${p}%</span></div>`; };

/* ═════════ State & API ═════════ */
const S = { me: null, page: 'overview', accountId: '', days: 30, accounts: [] };
const cache = new Map();
const ACT = [];
const act = fn => `ACT[${ACT.push(fn) - 1}]()`;

async function api(path, opts = {}) {
  const useCache = !opts.body && !opts.fresh;
  if (useCache && cache.has(path) && Date.now() - cache.get(path).t < 120000) return cache.get(path).d;
  const res = await fetch(path, opts.body
    ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(opts.body), credentials: 'same-origin' }
    : { credentials: 'same-origin' });
  let data; try { data = await res.json(); } catch { data = { error: `Unexpected response (HTTP ${res.status})` }; }
  if (res.status === 401 && !path.startsWith('/api/auth/')) { showLogin('Your session has ended. Please sign in again.'); throw new Error('Signed out'); }
  if (data && data.error) throw new Error(data.error);
  if (useCache) cache.set(path, { t: Date.now(), d: data });
  return data;
}
const q = obj => { const p = new URLSearchParams(); for (const [k, v] of Object.entries(obj)) if (v !== '' && v != null) p.set(k, v); const s = p.toString(); return s ? '?' + s : ''; };
const acct = () => (S.me.role === 'admin' ? S.accountId : '');
function rangeDates() {
  const iso = d => d.toISOString().slice(0, 10), to = new Date(), from = new Date();
  from.setUTCDate(from.getUTCDate() - (S.days - 1));
  return { from: iso(from), to: iso(to) };
}
const rangeLabel = () => $('range-filter').selectedOptions[0].textContent.toLowerCase();
const getStats = () => api('/api/stats' + q({ ...rangeDates(), accountId: acct() }));
const getCampaigns = () => api('/api/campaigns' + q({ accountId: acct() }));

/* ═════════ Auth ═════════ */
function showLogin(msg) {
  $('app').classList.add('hidden'); $('login').classList.remove('hidden'); closeDrawer();
  $('login-error').textContent = msg || ''; $('login-error').classList.toggle('hidden', !msg);
  cache.clear(); S.me = null;
}
$('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('login-btn'); btn.disabled = true; btn.textContent = 'Signing in…'; $('login-error').classList.add('hidden');
  try {
    await api('/api/auth/login', { body: { email: $('login-email').value, password: $('login-password').value } });

});
async function logout() { try { await api('/api/auth/logout', { body: {} }); } catch {} showLogin(); }

function buildNav() {

    const title = key === 'accounts' && S.me.role === 'admin' ? 'LinkedIn accounts' : p.title;

function route() {
  if (!S.me) return;

let renderToken = 0;
async function render() {
  const p = PAGES[S.page], token = ++renderToken;
  ACT.length = 0; CHARTS.length = 0; closeDrawer(); toggleNav(false);
  $('page-title').textContent = S.page === 'accounts' && S.me.role === 'admin' ? 'LinkedIn accounts' : p.title;
  $('page-sub').textContent = p.sub;
  $('range-filter').classList.toggle('hidden', !p.range);
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.page === S.page));

  el.innerHTML = skeleton(96, 1) + skeleton(280, 1);

/* ═════════ Data table ═════════ */
const TABLES = {};
function dataTable(cfg) {
  TABLES[cfg.id] = Object.assign({ sort: null, dir: 1, q: '', f: '', page: 0, pageSize: 25 }, cfg);
  return `<div class="card" id="${cfg.id}"></div>`;
}
function mountTable(id) {
  const t = TABLES[id], el = $(id); if (!t || !el) return;
  let filterHtml = '';
  if (t.filter) {
    const counts = {}; t.rows.forEach(r => { const v = t.filter.get(r); counts[v] = (counts[v] || 0) + 1; });
    filterHtml = `<select class="select" data-role="filter"><option value="">${esc(t.filter.label)}: all</option>${Object.keys(counts).sort().map(v => `<option value="${esc(v)}">${esc(t.filter.format ? t.filter.format(v) : v)} (${counts[v]})</option>`).join('')}</select>`;
  }
  el.innerHTML = `<div class="tbl-bar">${t.search === false ? '' : `<input class="input search" data-role="search" type="search" placeholder="${esc(t.placeholder || 'Search…')}">`}${filterHtml}${t.tools || ''}<span class="tbl-count"></span></div><div class="tbl-scroll"></div><div class="tbl-foot"></div>`;
  el.querySelector('[data-role=search]')?.addEventListener('input', e => { t.q = e.target.value.toLowerCase(); t.page = 0; drawTable(id); });
  el.querySelector('[data-role=filter]')?.addEventListener('change', e => { t.f = e.target.value; t.page = 0; drawTable(id); });
  drawTable(id);
}
function tableRows(t) {
  let rows = t.rows.map((r, i) => ({ r, i }));
  if (t.f) rows = rows.filter(x => String(t.filter.get(x.r)) === t.f);
  if (t.q) rows = rows.filter(x => t.cols.some(c => String(c.get(x.r) ?? '').toLowerCase().includes(t.q)));
  if (t.sort != null) { const c = t.cols[t.sort]; rows.sort((a, b) => { const x = c.get(a.r), y = c.get(b.r); return (x == null ? -1 : y == null ? 1 : typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y))) * t.dir; }); }
  return rows;
}
function drawTable(id) {
  const t = TABLES[id], el = $(id); if (!el) return;
  const rows = tableRows(t), pages = Math.max(1, Math.ceil(rows.length / t.pageSize));
  t.page = Math.min(t.page, pages - 1);
  const slice = rows.slice(t.page * t.pageSize, (t.page + 1) * t.pageSize);
  const head = t.cols.map((c, i) => `<th class="${c.num ? 'r ' : ''}${c.sort === false ? '' : 'sortable'}" ${c.sort === false ? '' : `onclick="sortTable('${id}',${i})"`}>${esc(c.label)}${t.sort === i ? (t.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`).join('');
  const body = slice.length ? slice.map(x => `<tr class="${t.onRow ? 'click' : ''}" ${t.onRow ? `onclick="TABLES['${id}'].onRow(TABLES['${id}'].rows[${x.i}])"` : ''}>${t.cols.map(c => `<td class="${c.num ? 'r num' : ''}">${c.html ? c.html(x.r) : esc(c.get(x.r) ?? '—')}</td>`).join('')}</tr>`).join('')
    : `<tr><td colspan="${t.cols.length}">${stateBox(t.rows.length ? 'No matches' : (t.empty || 'Nothing here yet'), t.rows.length ? 'Try a different search or filter.' : '')}</td></tr>`;
  const foot = t.totals && rows.length ? `<tfoot><tr>${t.totals(rows.map(x => x.r)).map((v, i) => `<td class="${t.cols[i].num ? 'r num' : ''}">${v}</td>`).join('')}</tr></tfoot>` : '';
  el.querySelector('.tbl-scroll').innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table>`;
  el.querySelector('.tbl-count').textContent = `${n(rows.length)} ${rows.length === 1 ? 'row' : 'rows'}${t.total && t.total > t.rows.length ? ` · ${n(t.rows.length)} of ${n(t.total)} loaded` : ''}`;
  const more = t.more && t.total > t.rows.length ? `<button class="btn sm" onclick="TABLES['${id}'].more()">Load more</button>` : '';
  el.querySelector('.tbl-foot').innerHTML = `<span>Page ${t.page + 1} of ${pages}</span><span class="right">${more}<button class="btn sm" ${t.page ? '' : 'disabled'} onclick="pageTable('${id}',-1)">Previous</button><button class="btn sm" ${t.page < pages - 1 ? '' : 'disabled'} onclick="pageTable('${id}',1)">Next</button></span>`;
  el.querySelector('.tbl-foot').classList.toggle('hidden', pages === 1 && !more);
}
function sortTable(id, i) { const t = TABLES[id]; if (t.sort === i) t.dir = -t.dir; else { t.sort = i; t.dir = t.cols[i].num ? -1 : 1; } drawTable(id); }
function pageTable(id, d) { TABLES[id].page += d; drawTable(id); }
/* Table backed by a paged endpoint: loads 100 at a time */
async function remoteTable(id, url, params, cfg) {
  const load = async offset => api(url + q({ ...params, offset, limit: 100 }));
  const first = await load(0);
  const html = dataTable({ id, rows: first.items || [], total: first.totalCount ?? (first.items || []).length, ...cfg,
    more: async () => { const t = TABLES[id]; const next = await load(t.rows.length); t.rows.push(...(next.items || [])); if (!(next.items || []).length) t.total = t.rows.length; drawTable(id); } });
  return html;
}

/* ═════════ Charts ═════════ */
const CHARTS = [];
const SERIES = [
  { key: 'connectionsSent', label: 'Connections sent', color: 'var(--s1)' },
  { key: 'connectionsAccepted', label: 'Accepted', color: 'var(--s2)' },
  { key: 'messagesSent', label: 'Messages sent', color: 'var(--s3)' },
  { key: 'totalMessageReplies', label: 'Replies', color: 'var(--s4)' },
];
function niceScale(v) { if (v <= 5) return [5, 5]; const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p, m = f <= 1 ? 1 : f <= 2 ? 2 : f <= 4 ? 4 : f <= 5 ? 5 : 10; return [m * p, m === 5 || m === 10 || m === 1 ? 5 : 4]; }
function activityCard(daily) {
  const has = daily.some(d => SERIES.some(s => d[s.key]));
  const id = 'chart-' + CHARTS.length;
  if (has) CHARTS.push(() => drawLine(id, daily));
  return `<div class="card"><div class="card-h"><h3>Daily activity</h3><div class="right"><button class="btn sm" onclick="this.closest('.card').querySelector('.chart-table').classList.toggle('hidden')">Table</button></div></div>
    <div class="card-b">${has ? `<div class="legend" style="margin-bottom:10px">${SERIES.map(s => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')}</div><div class="chart" id="${id}"></div>` : stateBox('No activity in this period', 'Try a longer date range.')}
    <div class="chart-table hidden tbl-scroll" style="margin-top:14px;max-height:280px;overflow-y:auto"><table><thead><tr><th>Date</th>${SERIES.map(s => `<th class="r">${s.label}</th>`).join('')}</tr></thead><tbody>${daily.slice().reverse().map(d => `<tr><td>${fmtDay(d.date)}</td>${SERIES.map(s => `<td class="r num">${n(d[s.key])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div></div>`;
}
function drawLine(id, daily) {
  const el = $(id); if (!el) return;
  const W = el.clientWidth, H = el.clientHeight, m = { t: 10, r: 14, b: 26, l: 44 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const [max, ticks] = niceScale(Math.max(1, ...daily.flatMap(d => SERIES.map(s => d[s.key] || 0))));
  const x = i => m.l + (daily.length === 1 ? iw / 2 : i / (daily.length - 1) * iw), y = v => m.t + ih - v / max * ih;
  let g = '';
  for (let i = 0; i <= ticks; i++) { const v = max / ticks * i; g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${i ? 'var(--grid)' : 'var(--axis)'}"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${n(Math.round(v))}</text>`; }
  const step = Math.max(1, Math.ceil(daily.length / Math.max(2, Math.floor(iw / 80))));
  daily.forEach((d, i) => { if (i % step === 0 && x(i) < W - m.r - 20 || daily.length === 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${fmtDay(d.date)}</text>`; });
  for (const s of SERIES) {
    g += `<path d="${daily.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(d[s.key] || 0).toFixed(1)}`).join('')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (daily.length === 1) g += `<circle cx="${x(0)}" cy="${y(daily[0][s.key] || 0)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily activity line chart">${g}<line class="cross" y1="${m.t}" y2="${m.t + ih}" stroke="var(--axis)" stroke-dasharray="3 3" visibility="hidden"/><g class="dots"></g><rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip hidden"></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), cross = el.querySelector('.cross'), dots = el.querySelector('.dots');
  svg.addEventListener('mousemove', e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(daily.length - 1, Math.round((px - m.l) / iw * (daily.length - 1) || 0))), d = daily[i];
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
    dots.innerHTML = SERIES.map(s => `<circle cx="${x(i)}" cy="${y(d[s.key] || 0)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join('');
    tip.innerHTML = `<div class="tip-h">${fmtDay(d.date)}</div>` + SERIES.map(s => `<div class="tip-r"><i style="background:${s.color}"></i>${s.label}<b>${n(d[s.key])}</b></div>`).join('');
    tip.classList.remove('hidden');
    const left = x(i) / W * r.width; tip.style.left = (left > r.width / 2 ? left - tip.offsetWidth - 14 : left + 14) + 'px'; tip.style.top = '12px';
  });
  svg.addEventListener('mouseleave', () => { tip.classList.add('hidden'); cross.setAttribute('visibility', 'hidden'); dots.innerHTML = ''; });
}
function hbars(items, showShare) {
  const max = Math.max(1, ...items.map(i => i.value)), first = items[0]?.value || 0;
  return items.map(i => `<div class="hbar" title="${esc(i.label)}: ${n(i.value)}"><span class="sub">${i.html || esc(i.label)}</span><div class="hbar-track"><div class="hbar-fill" style="width:${i.value / max * 100}%"></div></div><span><b>${n(i.value)}</b>${showShare && first ? `<small>${(i.value / first * 100).toFixed(0)}%</small>` : ''}</span></div>`).join('');
}
let resizeTimer; window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => CHARTS.forEach(f => f()), 150); });
const tile = (label, value, note) => `<div class="card tile"><div class="tile-label">${esc(label)}</div><div class="tile-value num">${value}</div><div class="tile-note">${note || '&nbsp;'}</div></div>`;
function perfTiles(t) {
  return `<div class="tiles">
    ${tile('Connections sent', n(t.connectionsSent))}
    ${tile('Connections accepted', n(t.connectionsAccepted), `${pct(t.acceptRate)} acceptance rate`)}
    ${tile('Messages sent', n(t.messagesSent))}
    ${tile('Replies', n(t.totalMessageReplies), `${pct(t.replyRate)} reply rate`)}</div>`;
}
function finish(el, html, alive) { if (!alive()) return; el.innerHTML = html; Object.keys(TABLES).forEach(id => { if ($(id) && !$(id).children.length) mountTable(id); }); CHARTS.forEach(f => f()); }

/* ═════════ Views ═════════ */
const VIEWS = {};

VIEWS.overview = async (el, alive) => {
  const [ov, st] = await Promise.all([api('/api/overview' + q({ accountId: acct() })), getStats().catch(e => ({ error: e.message }))]);
  const order = ['IN_PROGRESS', 'SCHEDULED', 'STARTING', 'PAUSED', 'DRAFT', 'FINISHED', 'FAILED', 'CANCELED'];
  const statuses = Object.entries(ov.statusBreakdown || {}).sort((a, b) => (order.indexOf(a[0]) + 99) % 99 - (order.indexOf(b[0]) + 99) % 99);
  const active = (ov.campaigns || []).filter(c => c.status === 'IN_PROGRESS').slice(0, 6);
  let html = (ov.partial ? `<div class="alert warn">HeyReach returned only part of the data, so some totals may be low. Try refreshing.</div>` : '') + `<div class="tiles">
    ${tile('Active campaigns', n(ov.activeCampaigns), `of ${n(ov.totalCampaigns)} campaigns`)}
    ${tile('Leads in lists', n(ov.totalLeads), `${n(ov.leadLists)} lead list${ov.leadLists === 1 ? '' : 's'}${ov.companyLists ? ` · ${n(ov.companyLists)} company` : ''}`)}
    ${tile('Conversations', ov.totalInbox == null ? '—' : n(ov.totalInbox), ov.inboxError ? 'Inbox unavailable' : 'in the inbox')}
    ${S.me.role === 'admin' && !acct() ? tile('LinkedIn accounts', n(ov.totalAccounts), `${n(ov.activeAccounts)} active`) : ''}</div>
    <div class="section-title"><h2>Performance</h2><span>${esc(rangeLabel())}</span></div>`;

const leadName = p => `${p.firstName || ''} ${p.lastName || ''}`.trim() || 'Unknown';
const leadCell = p => { const url = safeUrl(p.profileUrl || p.linkedInUrl); return `<div class="cell-main">${esc(leadName(p))}${url ? ` <a href="${esc(url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" title="Open LinkedIn profile">↗</a>` : ''}</div><div class="cell-sub">${esc((p.headline || p.position || p.summary || '').slice(0, 90))}</div>`; };

/* Sequence flow */
const NODE = {
  CONNECTION_REQUEST: ['Connection request', '<path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/>', 'Accepted', 'Not accepted'],
  MESSAGE: ['Message', '<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>', 'Replied', 'No reply'],
  INMAIL: ['InMail', '<path d="M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2z"/><path d="M22 6l-10 7L2 6"/>', 'Replied', 'No reply'],
  VIEW_PROFILE: ['View profile', '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'],
  FOLLOW: ['Follow', '<path d="M12 5v14M5 12h14"/>'], LIKE_POST: ['Like post', '<path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.3a2 2 0 002-1.7l1.4-9a2 2 0 00-2-2.3zM7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3"/>'],
  FIND_EMAIL: ['Find email', '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>', 'Email found', 'Not found'],
  CHECK_IS_CONNECTION: ['Is a connection?', '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>', 'Connected', 'Not connected'],
  CHECK_IS_OPEN_PROFILE: ['Open profile?', '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>', 'Open profile', 'Not open'],
};
function flow(node) {
  if (!node || !node.nodeType) return '';
  if (node.nodeType === 'END') return `<div class="node end">End</div>`;
  const [label, ic, yes, no] = NODE[node.nodeType] || [humanize(node.nodeType), '<circle cx="12" cy="12" r="9"/>'];
  const delay = node.actionDelay ? `Wait ${node.actionDelay} ${String(node.actionDelayUnit || 'hour').toLowerCase()}${node.actionDelay > 1 ? 's' : ''}` : 'Immediately';
  const pl = node.payload || {}, first = (pl.messages || [])[0], msg = typeof first === 'string' ? first : first ? [first.subject, first.message].filter(Boolean).join('\n\n') : '';
  const variants = (pl.messages || []).length;
  let html = `<div class="node"><div class="node-h"><div class="node-ic">${icon(ic)}</div><div><div class="node-t">${esc(label)}</div><div class="node-d">${esc(delay)}${variants > 1 ? ` · ${variants} variants` : ''}</div></div></div>${msg ? `<div class="node-msg">${esc(msg)}</div>` : ''}</div>`;
  const c = node.conditionalNode, u = node.unconditionalNode;
  const trivial = x => !x || x.nodeType === 'END';
  if (c && u && !(trivial(c) && trivial(u))) html += `<div class="wire"></div><div class="branches"><div class="branch"><div class="wire"></div><span class="branch-label yes">${esc(yes || 'Yes')}</span><div class="wire"></div>${flow(c)}</div><div class="branch"><div class="wire"></div><span class="branch-label no">${esc(no || 'Otherwise')}</span><div class="wire"></div>${flow(u)}</div></div>`;
  else if (u || c) html += `<div class="wire"></div>${flow(u || c)}`;
  return html;
}

VIEWS.inbox = async (el, alive) => {
  const IN = { items: [], total: 0, q: '', unread: false, active: null };
  const load = async () => { const d = await api('/api/inbox' + q({ offset: IN.items.length, limit: 50, accountId: acct() })); IN.items.push(...(d.items || [])); IN.total = d.totalCount ?? IN.items.length; if (!(d.items || []).length) IN.total = IN.items.length; };
  await load();
  const who = c => { const p = c.correspondentProfile || {}; return `${p.firstName || ''} ${p.lastName || ''}`.trim() || 'Unknown'; };
  const drawList = () => {
    const rows = IN.items.map((c, i) => ({ c, i })).filter(x => (!IN.unread || !x.c.read) && (!IN.q || (who(x.c) + ' ' + (x.c.lastMessageText || '')).toLowerCase().includes(IN.q)));
    $('conv-scroll').innerHTML = (rows.length ? rows.map(({ c, i }) => { const pic = safeUrl((c.correspondentProfile || {}).profilePicUrl); return `<div class="conv ${c.read ? '' : 'unread'} ${IN.active === i ? 'active' : ''}" onclick="${act(() => openConv(i))}"><div class="avatar">${pic ? `<img src="${esc(pic)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}${pic ? '' : esc(initials(who(c)))}</div><div class="conv-body"><div class="conv-top"><span class="conv-name">${esc(who(c))}</span><span class="conv-time">${esc(fmtDateTime(c.lastMessageAt))}</span></div><div class="conv-prev">${esc(c.lastMessageText || '')}</div></div></div>`; }).join('') : stateBox('No conversations', IN.q || IN.unread ? 'Nothing matches your filter.' : ''))
      + (IN.total > IN.items.length ? `<div style="padding:12px;text-align:center"><button class="btn sm" onclick="${act(async () => { await load(); drawList(); })}">Load more (${n(IN.items.length)} of ${n(IN.total)})</button></div>` : '');
  };
  const openConv = async i => {
    IN.active = i; drawList(); $('inbox').classList.add('open');
    const c = IN.items[i], p = c.correspondentProfile || {}, url = safeUrl(p.linkedInUrl || p.profileUrl);
    $('chat').innerHTML = `<div class="chat-h"><button class="btn sm back-btn" onclick="${act(() => $('inbox').classList.remove('open'))}">← Back</button><div class="avatar">${esc(initials(who(c)))}</div><div style="min-width:0"><div class="cell-main">${esc(who(c))}${url ? ` <a href="${esc(url)}" target="_blank" rel="noopener noreferrer">↗</a>` : ''}</div><div class="cell-sub">${esc((p.headline || '').slice(0, 110))}</div></div>${c.campaignName ? `<span class="chip" style="margin-left:auto">${esc(c.campaignName)}</span>` : ''}</div><div class="chat-b" id="chat-b">${skeleton(60, 3)}</div>`;
    let msgs = Array.isArray(c.messages) && c.messages.length ? c.messages : null;
    if (!msgs) { try { const room = await api('/api/inbox/chatroom' + q({ accountId: c.linkedInAccountId, conversationId: c.id })); msgs = room.messages || room.items || []; } catch (e) { if ($('chat-b')) $('chat-b').innerHTML = errorBox(e.message); return; } }
    if (IN.active !== i || !$('chat-b')) return;
    msgs = msgs.slice().sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
    $('chat-b').innerHTML = msgs.length ? msgs.map(m => { const out = m.sender === 'ME' || m.isOutbound === true || m.direction === 'Outbound'; return `<div class="msg ${out ? 'out' : ''}">${m.subject ? `<strong>${esc(m.subject)}</strong>\n` : ''}${esc(m.body || m.text || m.message || '(no text)')}<span class="msg-t">${esc(fmtDateTime(m.createdAt))}</span></div>`; }).join('') : stateBox('No messages');
    $('chat-b').scrollTop = $('chat-b').scrollHeight;
  };
  finish(el, `<div class="card inbox" id="inbox"><div class="conv-list"><div class="tbl-bar"><input class="input search" id="conv-q" type="search" placeholder="Search conversations…" style="max-width:none"><label class="cell-sub" style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="conv-unread">Unread</label></div><div class="conv-scroll" id="conv-scroll"></div></div><div class="chat" id="chat">${stateBox('Select a conversation', 'Messages are shown read-only.')}</div></div>`, alive);
  if (!alive()) return;
  $('conv-q').addEventListener('input', e => { IN.q = e.target.value.toLowerCase(); drawList(); });
  $('conv-unread').addEventListener('change', e => { IN.unread = e.target.checked; drawList(); });
  drawList();
};

  finish(el, dataTable({ id: 'tbl-webhooks', rows: d.items || [], placeholder: 'Search webhooks…', empty: 'No webhooks configured',
    onRow: w => openDrawer({ title: w.name || 'Webhook ' + w.id, meta: w.isActive ? '<span class="badge good">Active</span>' : '<span class="badge">Inactive</span>', tabs: { Details: async box => { box.innerHTML = kvCard(await api('/api/webhooks/getById' + q({ webhookId: w.id }))); } } }),
    cols: [{ label: 'Webhook', get: w => w.name || '', html: w => `<span class="cell-main">${esc(w.name || 'Unnamed')}</span>` }, { label: 'Event', get: w => w.eventType || '', html: w => `<span class="chip">${esc(humanize(w.eventType))}</span>` },
      { label: 'URL', get: w => w.url || '', html: w => `<span class="cell-sub">${esc((w.url || '').slice(0, 60))}</span>` }, { label: 'Status', get: w => (w.isActive ? 'Active' : 'Inactive'), html: w => (w.isActive ? '<span class="badge good">Active</span>' : '<span class="badge">Inactive</span>') }] }), alive);
};

/* ═════════ Drawer & key/value ═════════ */
function kvCard(obj, skip = []) {
  const rows = Object.entries(obj || {}).filter(([k, v]) => !skip.includes(k) && v !== null && v !== '');
  if (!rows.length) return `<div class="card">${stateBox('No details')}</div>`;
  const val = (k, v) => typeof v === 'boolean' ? (v ? 'Yes' : 'No') : typeof v === 'number' ? esc(v) : typeof v === 'string' ? (/^\d{4}-\d\d-\d\dT/.test(v) ? esc(fmtDateTime(v) + ', ' + new Date(v).getFullYear()) : safeUrl(v) ? `<a href="${esc(v)}" target="_blank" rel="noopener noreferrer">${esc(v)}</a>` : esc(v)) : Array.isArray(v) && v.every(x => typeof x !== 'object') ? (v.length ? v.map(x => `<span class="chip">${esc(x)}</span>`).join(' ') : '—') : `<pre class="json">${esc(JSON.stringify(v, null, 2))}</pre>`;
  return `<div class="card kv">${rows.map(([k, v]) => `<div>${esc(humanize(k.replace(/([a-z])([A-Z])/g, '$1 $2')))}</div><div>${val(k, v)}</div>`).join('')}</div>`;
}
function openDrawer({ title, meta, tabs }) {
  const names = Object.keys(tabs);
  $('drawer-root').innerHTML = `<div class="drawer-scrim" onclick="closeDrawer()"></div><aside class="drawer" role="dialog" aria-label="${esc(title)}"><div class="drawer-h"><div class="drawer-title"><div><h2>${esc(title)}</h2><div style="margin-top:6px">${meta || ''}</div></div><button class="btn icon" onclick="closeDrawer()" aria-label="Close">${icon('<path d="M18 6L6 18M6 6l12 12"/>')}</button></div><div class="tabs">${names.map((t, i) => `<button class="tab" data-tab="${i}">${esc(t)}</button>`).join('')}</div></div><div class="drawer-b" id="drawer-b"></div></aside>`;
  const show = async i => {
    document.querySelectorAll('.drawer .tab').forEach((b, j) => b.classList.toggle('active', i === j));
    const box = $('drawer-b'); box.innerHTML = skeleton(140, 2);
    try { await tabs[names[i]](box); } catch (e) { box.innerHTML = errorBox(e.message); }
  };
  document.querySelectorAll('.drawer .tab').forEach((b, i) => b.addEventListener('click', () => show(i)));
  show(0);
}
function closeDrawer() { $('drawer-root').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

/* ═════════ Start ═════════ */
try { const t = localStorage.getItem('bp-theme'); document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch { document.documentElement.dataset.theme = 'light'; }
boot();
</script>
